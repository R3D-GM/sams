# Local PostgreSQL for the attendance system.
# Start with: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: sams-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: attendance
    ports:
      - "5433:5432"
    volumes:
      - sams_data:/var/lib/postgresql/data

volumes:
  sams_data:
